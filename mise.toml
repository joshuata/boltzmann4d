[settings]
# `[deps]` is still experimental in mise.
experimental = true

[tools]
node = "24"
pnpm = "12"
hk = "2.11.1"
pkl = "0.33"
markdownlint-cli2 = "0.24"

# Install node_modules whenever package.json or pnpm-lock.yaml changed. `auto` runs this
# before every `mise run` / `mise exec`; it is skipped when node_modules is up to date.
[deps.pnpm]
auto = true

[hooks]
# `mise install` doesn't run deps providers itself, so trigger them once tools are in place.
postinstall = "mise deps"

[tasks.dev]
description = "Start the Vite dev server"
run = "pnpm dev"

[tasks.build]
description = "Type-check and build the production bundle into dist/"
run = "pnpm build"
sources = ["src/**/*", "index.html", "package.json", "pnpm-lock.yaml", "tsconfig.json", "vite.config.ts", "svelte.config.js"]
outputs = ["dist/**/*"]

[tasks.test]
description = "Run the Vitest suite once"
run = "pnpm test"

[tasks.bench]
description = "Run the Vitest benchmarks (*.bench.ts)"
run = "pnpm exec vitest bench --run"

[tasks.profile]
description = "Profile the engine headless: mise run profile [preset] [--events N] [--particles N --periodic]; writes profiles/*.cpuprofile"
run = "node --import tsx --cpu-prof --cpu-prof-dir=profiles scripts/profile.ts"

[tasks."bench:scaling"]
description = "Web engine scaling benchmark (writes benchmarks/results/web-node.json)"
run = "node --expose-gc --import tsx scripts/bench-scaling.ts"

[tasks."bench:java"]
description = "Java app scaling benchmark via boltzmann3d's `ant benchmark` (writes benchmarks/results/java.json)"
run = 'cd "${BOLTZMANN3D_DIR:-../boltzmann3d}" && mise exec java@temurin-25 ant@1.10.18 -- ant benchmark -Dbenchmark.out="{{config_root}}/benchmarks/results/java.json"'

[tasks."bench:report"]
description = "Rebuild the tables in benchmarks/README.md from benchmarks/results/*.json"
run = "node --import tsx scripts/bench-report.ts"

[tasks."parity:fixtures"]
description = "Regenerate src/sim/parity/*.json via boltzmann3d's `ant parity-dump`"
run = 'cd "${BOLTZMANN3D_DIR:-../boltzmann3d}" && mise exec java@temurin-25 ant@1.10.18 -- ant parity-dump -Dparity.out="{{config_root}}/src/sim/parity"'

[tasks.lint]
description = "Run all hk checks on every file"
run = "hk check --all"

[tasks.fix]
description = "Run all hk fixers on every file"
run = "hk fix --all"

[tasks.pre-commit]
run = "hk run pre-commit"
