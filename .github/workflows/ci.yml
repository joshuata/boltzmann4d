name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or PR. On PRs a newer push cancels the older run; on main runs queue
# instead, so a deployment is never cut off part-way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Installs the tools pinned in mise.toml; its postinstall hook runs `mise deps`
      # (pnpm install). Pinned to the mise release that `[deps]` was tested with.
      - uses: jdx/mise-action@v5.2.7
        with:
          version: 2026.10.17

      - run: mise run lint
      - run: mise run test
      - run: mise run build

      - name: Upload the site for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/web/build

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
